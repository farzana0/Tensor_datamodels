[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tndm"
version = "0.1.0"
description = "Tensor Network Datamodels for training data attribution"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anonymous Authors" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
# Analysis, figures and the CPU experiments (reasoning fits, modular, attribution comparison).
experiments = [
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "shapiq>=1.3",
]
# GPU fine-tuning experiments (AG News RoBERTa-LoRA, Sport-Music Qwen2-7B).
finetuning = [
  "transformers>=4.40",
  "peft>=0.10",
  "datasets>=2.18",
]
dev = [
  "pytest>=8",
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: reads all saved result files (a few seconds)"]
